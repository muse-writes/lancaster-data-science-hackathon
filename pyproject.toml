[project]
authors = [{name = "Clio Johnson", email = "d.k.johnson@lancaster.ac.uk"}]
dependencies = []
name = "lancaster-data-science-hackathon"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
lancaster_data_science_hackathon = { path = ".", editable = true }

[tool.pixi.tasks]
main = "python src/lancaster_data_science_hackathon/main.py"

[tool.pixi.dependencies]
pandas = ">=3.1.0,<4"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
scipy = ">=1.18.1,<2"
